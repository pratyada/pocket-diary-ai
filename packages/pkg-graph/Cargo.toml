[package]
name = "pkg-graph"
version = "0.1.0"
edition = "2021"
description = "Personal Knowledge Graph — SQLite-backed node/edge store with event journaling"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
